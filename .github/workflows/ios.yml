name: iOS

on:
  push:
    branches: [main]
    paths:
      - "crates/ovffi/**"
      - "crates/ovcore/**"
      - "crates/ovtransport/**"
      - "crates/ovapp/**"
      - "crates/ovrelay/**"
      - "crates/ovdiscovery/**"
      - "ios/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "crates/ovffi/**"
      - "crates/ovcore/**"
      - "crates/ovtransport/**"
      - "crates/ovapp/**"
      - "crates/ovrelay/**"
      - "crates/ovdiscovery/**"
      - "ios/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ios:
    name: ovffi + iOS app (simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain and the iOS targets listed in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test ovffi (host)
        run: cargo test -p ovffi --locked

      - name: Build simulator app
        run: ios/build_ios.sh --sim

      # The runner image decides which simulators exist; use an
      # available iPhone instead of a hard-coded model.
      - name: Unit tests (simulator)
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          ios = [d for rt, ds in devs.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          print(ios[-1]["udid"] if ios else "")')
          test -n "$udid" || { echo "no iPhone simulator available" >&2; exit 1; }
          DESTINATION="platform=iOS Simulator,id=$udid" ios/build_ios.sh --test

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: OpenView-simulator-app
          path: ios/build/DerivedData/Build/Products/Release-iphonesimulator/OpenView.app
          if-no-files-found: error
          retention-days: 14
