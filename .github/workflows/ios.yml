name: iOS

on:
  push:
    branches: [main]
    paths:
      - "crates/ovffi/**"
      - "crates/ovcore/**"
      - "crates/ovtransport/**"
      - "crates/ovapp/**"
      - "crates/ovrelay/**"
      - "crates/ovdiscovery/**"
      - "ios/**"
      - "scripts/ios_screenshots.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "crates/ovffi/**"
      - "crates/ovcore/**"
      - "crates/ovtransport/**"
      - "crates/ovapp/**"
      - "crates/ovrelay/**"
      - "crates/ovdiscovery/**"
      - "ios/**"
      - "scripts/ios_screenshots.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ios:
    name: ovffi + iOS app (simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain and the iOS targets listed in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test ovffi (host)
        run: cargo test -p ovffi --locked

      - name: Build simulator app
        run: bash ios/build_ios.sh --sim

      # The runner image decides which simulators exist; use an
      # available iPhone instead of a hard-coded model.
      - name: Unit tests (simulator)
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          ios = [d for rt, ds in devs.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          print(ios[-1]["udid"] if ios else "")')
          test -n "$udid" || { echo "no iPhone simulator available" >&2; exit 1; }
          DESTINATION="platform=iOS Simulator,id=$udid" bash ios/build_ios.sh --test

      - name: Upload simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenView-simulator-app
          path: ios/build/DerivedData/Build/Products/Release-iphonesimulator/OpenView.app
          if-no-files-found: error
          retention-days: 14

  screenshots:
    name: App Store-style screenshots (simulator)
    # Manual only: regenerates docs/images/ios-*.png as an artifact.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Capture screenshots
        run: bash scripts/ios_screenshots.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots
          path: docs/images/ios-*.png
          if-no-files-found: error
          retention-days: 14
