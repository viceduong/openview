name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Reused by release.yml as a gate before packaging.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows (fmt, clippy, test, e2e)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the channel, components and targets from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Docs (rustdoc warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: End-to-end (relay + host + viewer processes)
        shell: bash
        run: bash scripts/e2e_relay.sh

      - name: End-to-end (LAN session without a relay)
        shell: bash
        # Hosted runners may filter multicast: dial the LAN port directly.
        run: bash scripts/e2e_lan.sh --no-mdns

  linux:
    name: Linux (portable crates, fuzz harness)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The relay and the protocol crates are portable; the host, viewer
      # and GUI are Windows-only.
      - name: Test portable crates
        run: cargo test -p ovcore -p ovtransport -p ovrelay -p ovdiscovery -p ovcommon --locked

      - name: Clippy (portable crates)
        run: cargo clippy -p ovcore -p ovtransport -p ovrelay -p ovdiscovery -p ovcommon --all-targets --locked -- -D warnings

      - name: Check the fuzz harness
        run: cargo check --manifest-path fuzz/Cargo.toml --locked

  msrv:
    name: MSRV (rust-version)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv

      - name: Check
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --locked

  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # A new advisory against a dependency should not block unrelated PRs.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        # The action runs in a musl container. Left alone, rust-toolchain.toml
        # makes it fail `rustup show` ("override toolchain ... not installed")
        # and then download stable plus our Windows/iOS targets. Install a
        # minimal stable in the container and select it over the file instead
        # (cargo-deny only needs `cargo metadata`).
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          rust-version: stable
          command: check ${{ matrix.checks }}

  docs:
    name: Docs (links, spelling)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check relative links in Markdown files
        run: python3 scripts/check_links.py
      - name: Spelling (typos, config in _typos.toml)
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
